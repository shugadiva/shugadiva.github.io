<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Детский альбом · Оркестровая яма</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kiosk.css">
<style>
  /* Оркестровая яма, Figma 4013:433–438 (сценарий #17, принят Дианой 18.11). Один файл, экран выбирает data-screen у .stage:
     intro 4013:433 · game 4013:434 (пусто), 4291:1295 (1 выбран), 4291:1341 (3), 4291:1397 (4), 4295:1403 (5) · final 4013:438.
     Ошибки, повтора мелодии и экранов «Успех» больше нет: по нажатию карточка Selected=True, над ней приходит свой зверь и остаётся.
     Когда собраны все пятеро, оркестр играет (звери покачиваются, звука в прототипе нет), затем финал. */
  .orch[data-screen="intro"] .screen--intro,
  .orch[data-screen="final"] .screen--final,
  .orch[data-screen="game"] .screen--game { display: block; }

  /* Шапка: на заставке только Меню и Звук, на остальных заголовок и Назад */
  .orch[data-screen="intro"] .header__title,
  .orch[data-screen="intro"] .back-button { visibility: hidden; }

  /* Заставка 4013:433 */
  .intro__bg { left: -644px; top: -396px; width: 2937px; height: 1584px; opacity: .8; transform: scaleX(-1); filter: blur(10px); }
  .intro__owl { left: 147px; top: -95px; width: 1661px; height: 1710px; }

  /* Игра: bg / луг 4013:1300, прогрессивный Layer blur 25 и непрозрачность 90% запечены в meadow-blur.webp */
  .game__bg { left: -268px; top: -249px; width: 2455px; height: 1380px; }

  /* row / музыканты 4296:1462: x 32, y 377, пять slot 365×360 через space/8, каждый над своей карточкой.
     Фото зверя FIT в слоте; медведь в макете сдвинут на 24 вправо внутри слота (4295:1440) */
  .band { position: absolute; left: var(--space-32); top: 377px; width: 1856px; height: 360px; display: flex; gap: var(--space-8); pointer-events: none; }
  .slot { position: relative; flex: 1 1 0; min-width: 0; height: 360px; }
  .slot__photo {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; translate: 0 48px; scale: .85; transform-origin: 50% 100%;
    transition: opacity var(--duration-slow) var(--easing-out), translate 600ms var(--easing-spring), scale 600ms var(--easing-spring);
  }
  .slot--balalaika .slot__photo { left: 24px; }
  .slot.is-here .slot__photo { opacity: 1; translate: 0 0; scale: 1; }
  /* Оркестр играет: зверята покачиваются в такт, у каждого свой сдвиг фазы */
  .orch.is-playing .slot__photo { animation: play 900ms var(--easing-sway) var(--d, 0s) infinite alternate; }
  .slot:nth-child(2) { --d: -.3s; } .slot:nth-child(3) { --d: -.6s; } .slot:nth-child(4) { --d: -.15s; } .slot:nth-child(5) { --d: -.45s; }
  @keyframes play { from { rotate: -3deg; translate: 0 0; } to { rotate: 3deg; translate: 0 -12px; } }

  /* Instrument Strip 4012:140: 1856, gap space/8, пять карточек поровну */
  .strip { position: absolute; left: var(--space-32); top: 828px; width: 1856px; display: flex; gap: var(--space-8); }
  /* Instrument Card 4011:111: паддинг и gap space/16, radius/card-sm, Surface/glass-card + Glass, фото 120, строка подписи 52 */
  .card {
    position: relative; flex: 1 1 0; min-width: 0; height: 220px;
    display: flex; flex-direction: column; align-items: center; gap: var(--space-16);
    padding: var(--space-16); border-radius: var(--radius-card-sm);
    background: var(--surface-glass-card);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    color: var(--text-primary); text-align: center;
    transition: background-color .15s ease, scale var(--duration-press) var(--easing-out);
  }
  .card__photo { width: 100%; height: 120px; flex: none; object-fit: cover; }
  .card__row {
    width: 100%; height: 52px; flex: none;
    display: flex; align-items: center; justify-content: center;
    padding: var(--space-8); border-radius: var(--radius-card-sm);
  }
  .card:active { background: var(--surface-glass-pressed); scale: .98; }
  /* Selected=True: обводка 4 внутрь, Border/selected (4015:844) */
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 4px var(--border-selected); opacity: 0;
    transition: opacity var(--duration-base) var(--easing-standard);
  }
  .card.is-selected::after { opacity: 1; }
  .card.is-selected, .orch.is-playing .card { pointer-events: none; }

  /* Финал 4013:438 */
  .final__bg { left: -268px; top: -249px; width: 2455px; height: 1380px; }
  .final__orchestra { left: -268px; top: -263px; width: 2455px; height: 1380px; }
  .final__poppies { left: 0; top: 580px; width: 1920px; height: 500px; filter: blur(15px); }
</style>
<link rel="stylesheet" href="motion.css">
</head>
<body>
<main class="stage orch" id="orch" data-screen="intro">

  <!-- Заставка 4013:433 -->
  <section class="screen screen--intro" aria-label="Заставка">
    <img class="layer intro__bg cover" src="assets/orchestra/intro-bg.webp" alt="">
    <h1 class="intro-title t-display-lg">Оркестровая яма</h1>
    <img class="layer intro__owl" src="assets/orchestra/intro-owl.webp" alt="Сова-дирижёр взмахивает палочкой">
    <div class="stack stack--dark">
      <button class="button" type="button" data-go="game">
        <span class="button__circle"><span class="icon icon--arrow-right"></span></span>
        <span class="t-label-lg">Начать</span>
      </button>
      <p class="stack__desc t-heading-md">Нажимайте на&nbsp;инструменты, и&nbsp;на&nbsp;поляну придут музыканты. Когда соберутся все пятеро, заиграет оркестр!</p>
    </div>
  </section>

  <!-- Игра 4013:434 пусто · 4291:1295 1 выбран · 4291:1341 3 · 4291:1397 4 · 4295:1403 5 -->
  <section class="screen screen--game" aria-label="Собери оркестр">
    <img class="layer game__bg cover" src="assets/orchestra/meadow-blur.webp" alt="">
    <div class="band" id="band"></div>
    <div class="strip" id="strip"></div>
  </section>

  <!-- Финал 4013:438 -->
  <section class="screen screen--final" aria-label="Финал">
    <img class="layer final__bg cover" src="assets/orchestra/meadow-blur.webp" alt="">
    <img class="layer final__orchestra cover" src="assets/orchestra/final-orchestra.webp" alt="Зверята играют в оркестре">
    <img class="layer final__poppies cover" src="assets/orchestra/final-poppies.webp" alt="">
    <div class="stack stack--accent">
      <a class="button button--md button--plain" href="choice.html?game=orchestra"><span class="t-label-md">Вернуться в&nbsp;меню</span></a>
      <div class="stack__text">
        <p class="t-text-lg">Блестящие знания! Дирижёр снимает шляпу</p>
        <h2 class="t-display-md">Вы&nbsp;собрали весь оркестр!</h2>
      </div>
    </div>
  </section>

  <header class="header">
    <h1 class="header__title t-heading-md">Оркестровая яма</h1>
    <div class="header__actions">
      <a class="back-button" href="choice.html?game=orchestra">
        <span class="icon-button"><span class="icon icon--reply"></span></span>
        <span class="t-label-md">Назад</span>
      </a>
      <div class="header__group">
        <a class="icon-button" href="choice.html?game=orchestra" aria-label="В меню"><span class="icon icon--menu"></span></a>
        <button class="icon-button" type="button" data-sound aria-pressed="false" aria-label="Звук"><span class="icon icon--volume"></span></button>
      </div>
    </div>
  </header>
</main>

<template id="cardTpl">
  <button class="card" type="button" aria-pressed="false">
    <img class="card__photo" alt="">
    <span class="card__row"><span class="card__label t-text-lg"></span></span>
  </button>
</template>

<script src="kiosk.js"></script>
<script>
  // Сценарий: Начать → нажатия на инструменты в любом порядке, над каждой карточкой приходит свой музыкант и остаётся →
  // когда собраны все пятеро, оркестр играет PLAY_MS (звука в прототипе нет) → финал.
  (function () {
    var LIST = [
      { key: 'klarnet', name: 'Кларнет', hero: 'Лисёнок' }, { key: 'dombra', name: 'Домбра', hero: 'Ёжик' },
      { key: 'bayan', name: 'Баян', hero: 'Барсук' }, { key: 'fleyta', name: 'Флейта', hero: 'Зайка' },
      { key: 'balalaika', name: 'Балалайка', hero: 'Медвежонок' }
    ];
    var PLAY_MS = 3000;
    var stage = document.getElementById('orch');
    var strip = document.getElementById('strip');
    var band = document.getElementById('band');
    var tpl = document.getElementById('cardTpl');
    var cards = [], slots = [], timer = null;

    LIST.forEach(function (it, i) {
      var c = tpl.content.firstElementChild.cloneNode(true);
      c.querySelector('.card__photo').src = 'assets/orchestra/card-' + it.key + '.webp';
      c.querySelector('.card__label').textContent = it.name;
      c.setAttribute('aria-label', it.name);
      c.addEventListener('click', function () { pick(i); });
      strip.appendChild(c); cards.push(c);
      var s = document.createElement('div');
      s.className = 'slot slot--' + it.key;
      s.innerHTML = '<img class="slot__photo" src="assets/orchestra/musician-' + it.key + '.webp" alt="' + it.hero + ' играет: ' + it.name.toLowerCase() + '">';
      band.appendChild(s); slots.push(s);
    });

    function select(i) {
      cards[i].classList.add('is-selected'); cards[i].setAttribute('aria-pressed', 'true');
      slots[i].classList.add('is-here');
    }
    function reset() {
      clearTimeout(timer); stage.classList.remove('is-playing');
      cards.forEach(function (c) { c.classList.remove('is-selected'); c.setAttribute('aria-pressed', 'false'); });
      slots.forEach(function (s) { s.classList.remove('is-here'); });
    }
    function pick(i) {
      select(i);
      if (cards.every(function (c) { return c.classList.contains('is-selected'); })) {
        // пятый музыкант успевает прийти, потом оркестр играет, потом финал
        timer = setTimeout(function () {
          stage.classList.add('is-playing');
          timer = setTimeout(function () { stage.dataset.screen = 'final'; }, PLAY_MS);
        }, 700);
      }
    }
    document.querySelector('[data-go="game"]').addEventListener('click', function () { reset(); stage.dataset.screen = 'game'; });

    // Для сверки с макетом: #game пустая поляна, #pick-1 / #pick-3 / #pick-4 / #pick-5 как кадры «N выбрано», #final
    var PICKS = { 1: [0], 3: [0, 1, 3], 4: [0, 1, 2, 3], 5: [0, 1, 2, 3, 4] };
    var hash = location.hash.slice(1), m = /^pick-(\d)$/.exec(hash);
    if (m && PICKS[m[1]]) { stage.dataset.screen = 'game'; PICKS[m[1]].forEach(select); }
    else if (hash === 'game' || hash === 'final') stage.dataset.screen = hash;
  })();
</script>
<script src="motion.js"></script>
</body>
</html>
