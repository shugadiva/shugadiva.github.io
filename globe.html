<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глобус agentory: полная копия механики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Полная копия механики глобуса с agentory.framer.website.
     Источник глобуса: cobe (github.com/shuding/cobe), MIT, ~5 КБ, один WebGL-шейдер.

     Главное, что копируем: цвет глобусу НЕ задаётся. Шар рендерится чёрно-белым,
     а на его обёртку повешен mix-blend-mode: multiply. Он умножается на размытое
     пятно под ним: белые точки материков берут цвет пятна, чёрная сфера остаётся
     чёрной и вырезает в свечении тёмный силуэт.

     Практический вывод: чтобы перекрасить глобус, меняется только --accent ниже.
     В шейдере не трогается ничего. */

  :root {
    --font: "Manrope", system-ui, sans-serif;

    /* палитра лендинга (portfolio/COLORS.md). Оригинал agentory:
       фон #0a0a0a, пятно #ff5101, вторичный текст #8a8a8a. */
    --page: #000309;         /* Surface/page */
    --accent: #5a94f5;       /* Blue/400: цвет дуг */
    /* Свечение как горизонт на span: светлое ядро, к краю насыщенный синий.
       Замер span-top.png: #A2CAFE в ядре, #6696D7, #3064AA, #113E77 к краю. */
    --glow: radial-gradient(circle closest-side, #8fbcfc 0%, #2e6ee8 64%, #0031ff 100%); /* как в макете: Blue/300 → Blue/500 → #0031FF, closest-side = край круга, как в Figma */
    --text-primary: #f5f8ff; /* Text/primary */
    --text-secondary: #7a7d84; /* Text/secondary */

    /* геометрия сцены, значения сняты с референса */
    --glow-size: 482px;
    --bg-size: 790px;
    --globe-w: 575px;
    --globe-h: 534px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text-primary);
    background: var(--page);
  }

  /* Секция обрезает всё лишнее снизу: слои прибиты к нижнему краю
     большими отрицательными bottom, поэтому из экрана торчит только шапка шара. */
  .hero {
    position: relative;
    height: 100vh;
    min-height: 720px;
    overflow: clip;
    background: var(--page);
    padding: 160px 20px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Слой 4: текст. Лежит выше всего, multiply его не трогает. */
  .hero__text { position: relative; z-index: 4; }

  h1 {
    max-width: 760px;
    margin: 0 auto 24px;
    font-size: 48px;
    line-height: 52.8px;
    letter-spacing: -0.03em;
    font-weight: 600;
  }
  h1 .muted { color: var(--text-secondary); }

  .lead {
    max-width: 560px;
    margin: 0 auto;
    font-size: 16px;
    line-height: 25.6px;
    letter-spacing: -0.006em;
    color: var(--text-secondary);
  }

  /* Слой 1: свечение. Именно его цвет станет цветом точек на шаре. */
  .hero__glow {
    position: absolute;
    z-index: 0;
    bottom: -194px;
    left: 50%;
    transform: translateX(-50%);
    width: var(--glow-size);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--glow);
    filter: blur(65px);
    animation: glow-in 1000ms cubic-bezier(0.25, 1, 0.5, 1) both;
  }

  /* Вход пятна, снятый с оригинала: прозрачность 0.001 → 1 за 1000 мс,
     повтор один, плюс пятно слегка подъезжает снизу. У них это пружина
     Framer Motion, в CSS её приближает длинная кривая с хвостом.
     Движение задано через `translate`, а не `transform`: иначе анимация
     затёрла бы центрирование по горизонтали и масштаб на узком экране. */
  @keyframes glow-in {
    from { opacity: 0.001; translate: 0 20px; }
    to   { opacity: 1;     translate: 0 0; }
  }

  /* Слой 2: дуги-орбиты. На референсе это готовый PNG 744x732, повёрнутый
     на 186°. Здесь те же дуги в SVG: геометрия снята с их PNG
     (три радиуса 575, 670, 777 в двойном масштабе, шесть отрезков),
     цвет один на все дуги, акцент с прозрачностью 12%, как у них.

     Центр дуг в их PNG не совпадает с центром картинки: смещён на
     (-39, -52) в двойном масштабе. Картинка стоит центром над шаром,
     а после поворота на 186° центр дуг оказывается на 12 px НИЖЕ центра
     шара и на 16 px правее. Сдвиг зашит в viewBox, поэтому поворот и
     дыхание идут вокруг центра картинки, как у них.

     Дышит весь блок целиком: 0.90 → 1.00 → 0.90 за 10 с, равномерно, без замедления на краях (замер их transform каждые 250 мс, 22.09.2026).
     Центрирование только свойством `translate`, `transform` не используется:
     браузер применяет translate, rotate, scale, потом transform, поэтому
     сдвиг -50% внутри transform масштабировался бы вместе с дыханием,
     и блок гулял бы вбок на 20-45 px. */
  .hero__bg {
    position: absolute;
    z-index: 1;
    bottom: calc(22px - var(--bg-size) / 2);
    left: 50%;
    translate: -50% 0;
    rotate: 186deg;
    width: var(--bg-size);
    aspect-ratio: 1;
    animation: rings-breathe 10s linear infinite;
  }
  .hero__bg svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .hero__bg path {
    fill: none;
    stroke: color-mix(in srgb, var(--accent) 12%, transparent);
    stroke-width: 12;
  }

  @keyframes rings-breathe {
    0%, 100% { scale: 0.9; }
    50%      { scale: 1; }
  }

  /* Слой 3: сам глобус.
     multiply живёт здесь, на обёртке canvas, и смешивается с двумя слоями ниже. */
  .hero__globe {
    position: absolute;
    z-index: 2;
    bottom: -260px;
    left: calc(50% - (var(--globe-w) / 2));
    width: var(--globe-w);
    height: var(--globe-h);
    mix-blend-mode: multiply;
  }

  /* Внутренняя обёртка гасит край canvas, иначе видна резкая граница кадра. */
  .hero__globe-inner {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 800px;
    /* Канвас квадратный 575, обёртка 534: у них он центрирован по вертикали
       и вылезает на 20.5 px сверху и снизу. Прижатый к верху шар сидел
       на 22 px ниже оригинала. */
    margin-top: calc((var(--globe-h) - var(--globe-w)) / 2);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 70%);
    mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,1) 60%, rgba(0,0,0,0) 70%);
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
    contain: layout paint size;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
  }
  canvas.dragging { cursor: grabbing; }

  /* Узкий экран. Как у оригинала: шар НЕ уменьшается и вылезает за края,
     верх шара остаётся около 296 px над низом секции (на 844 это 65% высоты).
     Уменьшаются только пятно (0.87) и чуть-чуть дуги (0.95). */
  @media (max-width: 900px) {
    .hero { padding: 96px 24px 80px; }
    h1 { font-size: 34px; line-height: 40px; }
    :root {
      --glow-size: 419px;
      --bg-size: 750px;
    }
    .hero__glow { bottom: -162px; }
  }

  /* Движение выключается, если человек попросил об этом в системе. */
  @media (prefers-reduced-motion: reduce) {
    .hero__bg { animation: none; }
    .hero__glow { animation: none; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero__text">
    <h1>Полная копия глобуса <span class="muted">с agentory</span></h1>
    <p class="lead">Чёрно-белый шар на cobe, синее пятно под ним и mix-blend-mode: multiply. Цвет живёт в пятне, не в шейдере.</p>
  </div>

  <div class="hero__glow"></div>

  <div class="hero__bg" aria-hidden="true">
    <svg viewBox="-751 -738 1580 1580">
      <path d="M555.5 374.7 A670 670 0 1 1 403.2 -535.1"/>
      <path d="M715.2 -303.6 A777 777 0 0 1 478.4 612.3"/>
      <path d="M388.5 672.9 A777 777 0 0 1 -698.4 340.6"/>
      <path d="M0 575 A575 575 0 0 1 -531.2 -220"/>
      <path d="M-406.6 -406.6 A575 575 0 0 1 0 -575"/>
      <path d="M531.6 219.1 A575 575 0 0 1 408 405.2"/>
    </svg>
  </div>

  <div class="hero__globe">
    <div class="hero__globe-inner">
      <canvas id="globe"></canvas>
    </div>
  </div>

</section>

<script type="module">
  // cobe с CDN. Для проекта ставится локально: npm i cobe.
  import createGlobe from "https://esm.sh/cobe@0.6.4";

  const canvas = document.getElementById("globe");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // DPR всегда 2, как у оригинала: на обычном мониторе с DPR 1 иначе
  // канвас рисуется в 575 px и точки выходят крупнее и рванее.
  const dpr = 2;
  // Шар на всех экранах 575, поэтому плотность одна.
  const samples = 20000;

  let size = canvas.offsetWidth || 575;
  let phi = 0;            // текущий поворот
  let theta = 0.3;        // наклон к северу
  let spin = 0;           // скорость от броска мышью, гасится трением
  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  const globe = createGlobe(canvas, {
    devicePixelRatio: dpr,
    width: size * dpr,
    height: size * dpr,
    phi: 0,
    theta,
    dark: 1,              // максимально тёмная ночная сторона
    diffuse: 2,           // жёсткий терминатор, шар читается объёмным
    mapSamples: samples,
    mapBrightness: 12,
    // Точки материков берут цвет из baseColor, умноженного на mapBrightness.
    // Чёрная база даёт чёрный шар вообще без материков, проверено в Chrome.
    // База белая, а тёмным шар делает dark: 1 — ночная сторона гасится отдельно.
    baseColor: [1, 1, 1],
    markerColor: [1, 1, 1],
    glowColor: [0.92, 0.914, 0.91],   // светлый ореол по краю, #EBE9E8
    markers: [],
    opacity: 1,
    onRender: (state) => {
      if (!dragging && !reduced) phi += 0.003;   // автовращение
      phi += spin;
      spin *= 0.94;                              // инерция после броска
      state.phi = phi;
      state.theta = theta;
      state.width = size * dpr;
      state.height = size * dpr;
    },
  });

  // Перетаскивание мышью и пальцем.
  const onDown = (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  };
  const onMove = (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    phi += dx * 0.005;
    theta = Math.max(-0.6, Math.min(0.9, theta + dy * 0.005));  // не даём шару перевернуться
    spin = dx * 0.0015;
  };
  const onUp = (e) => {
    dragging = false;
    canvas.classList.remove("dragging");
    if (e.pointerId !== undefined && canvas.hasPointerCapture?.(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  };
  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);

  const onResize = () => { size = canvas.offsetWidth || size; };
  window.addEventListener("resize", onResize);

  // Без destroy в dev-режиме накапливаются WebGL-контексты.
  window.addEventListener("pagehide", () => globe.destroy());
</script>

</body>
</html>
