<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Детский альбом · Угадай мелодию</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kiosk.css">
<style>
  /* Угадай мелодию, Figma 4013:439–443. Экран выбирает data-screen у .stage:
     intro 4013:439 · listen 4013:440 · error 4013:441 · success 4013:442 · final 4013:443 */
  .melody[data-screen="intro"] .screen--intro,
  .melody[data-screen="final"] .screen--final,
  .melody:is([data-screen="listen"], [data-screen="error"], [data-screen="success"]) .screen--game { display: block; }

  /* Фон игры меняется по состоянию: зайчонок слушает, чешет затылок, прыгает от радости */
  .game__bg { left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
  .melody[data-screen="listen"]  .game__bg--listen,
  .melody[data-screen="error"]   .game__bg--error,
  .melody[data-screen="success"] .game__bg--success { display: block; }

  /* Шапка: на заставке только Меню и Звук */
  .melody[data-screen="intro"] .header__title,
  .melody[data-screen="intro"] .back-button,
  .melody:is([data-screen="intro"], [data-screen="final"]) .counter { visibility: hidden; }

  /* Video Block Surface=None (4011:155): кадр = фон экрана, кнопка Play 112 на 568,475 */
  .play {
    position: absolute; left: 568px; top: 475px;
    width: var(--size-button-lg); height: var(--size-button-lg); border-radius: var(--radius-full);
    display: grid; place-items: center;
    background: var(--accent-primary); color: var(--text-on-accent); box-shadow: var(--shadow-arrow);
    transition: background-color .15s ease, transform .15s ease;
  }
  .play .icon { width: var(--size-icon-lg); height: var(--size-icon-lg); }
  .play:active { background: var(--accent-pressed); transform: scale(.96); }
  .play.is-playing { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 16px rgba(228, 111, 37, .25); } }

  /* Вопрос и ответы: 1248,160 w608, gap 16 */
  .qa { position: absolute; left: 1248px; top: 160px; width: 608px; display: flex; flex-direction: column; gap: var(--space-16); }
  .qa__answers { display: flex; flex-direction: column; gap: var(--space-16); }
  /* Answer Card md: подпись FILL по центру, справа место под иконку результата (gap 24 + 64) */
  .qa .answer-card__label { text-align: center; }
  .qa .answer-card:not(.is-correct):not(.is-wrong) .answer-card__label { margin-right: 88px; }
  .game__action { position: absolute; left: 1248px; top: 936px; display: none; }
  .melody[data-screen="error"]   [data-act="repeat"],
  .melody[data-screen="success"] [data-act="next"] { display: inline-flex; }

  .final__bg { left: 0; top: 0; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<main class="stage melody" id="melody" data-screen="intro">

  <!-- Заставка 4013:439 -->
  <section class="screen screen--intro" aria-label="Заставка">
    <img class="layer final__bg cover" src="assets/melody/intro.webp" alt="Медведь сидит у граммофона в лесу">
    <h1 class="intro-title t-display-lg">УгаДай меЛоДию</h1>
    <div class="stack stack--dark">
      <button class="button" type="button" data-go="listen">
        <span class="button__circle"><span class="icon icon--arrow-right"></span></span>
        <span class="t-label-lg">Начать</span>
      </button>
      <p class="stack__desc t-heading-md">Слушайте и&nbsp;угадывайте произведения из&nbsp;«Детского альбома» Петра&nbsp;Ильича&nbsp;Чайковского</p>
    </div>
  </section>

  <!-- Игра: 4013:440 прослушивание · 441 ошибка · 442 успех -->
  <section class="screen screen--game" aria-label="Угадай произведение">
    <img class="layer game__bg game__bg--listen cover" src="assets/melody/listen.webp" alt="Зайчонок слушает граммофон">
    <img class="layer game__bg game__bg--error cover" src="assets/melody/error.webp" alt="Зайчонок чешет затылок">
    <img class="layer game__bg game__bg--success cover" src="assets/melody/success.webp" alt="Зайчонок прыгает от радости">
    <button class="play" type="button" aria-label="Слушать мелодию"><span class="icon icon--play"></span></button>
    <div class="qa">
      <h2 class="t-heading-md">Как называется это произведение?</h2>
      <div class="qa__answers" id="answers">
        <button class="answer-card" type="button"><span class="answer-card__number t-label-lg">1</span><span class="answer-card__label t-text-lg">Утренняя молитва</span><span class="answer-card__result answer-card__result--ok icon icon--check-circle"></span><span class="answer-card__result answer-card__result--bad icon icon--close-circle"></span></button>
        <button class="answer-card" type="button"><span class="answer-card__number t-label-lg">2</span><span class="answer-card__label t-text-lg">Зимнее утро</span><span class="answer-card__result answer-card__result--ok icon icon--check-circle"></span><span class="answer-card__result answer-card__result--bad icon icon--close-circle"></span></button>
        <button class="answer-card" type="button" data-correct><span class="answer-card__number t-label-lg">3</span><span class="answer-card__label t-text-lg">Игра в&nbsp;лошадки</span><span class="answer-card__result answer-card__result--ok icon icon--check-circle"></span><span class="answer-card__result answer-card__result--bad icon icon--close-circle"></span></button>
        <button class="answer-card" type="button"><span class="answer-card__number t-label-lg">4</span><span class="answer-card__label t-text-lg">Мама</span><span class="answer-card__result answer-card__result--ok icon icon--check-circle"></span><span class="answer-card__result answer-card__result--bad icon icon--close-circle"></span></button>
      </div>
    </div>
    <button class="button button--md game__action" type="button" data-act="repeat">
      <span class="button__circle"><span class="icon icon--repeat-one"></span></span>
      <span class="t-label-md">Повторить мелодию</span>
    </button>
    <button class="button button--md button--accent game__action" type="button" data-act="next">
      <span class="t-label-md">Следующая мелодия</span>
      <span class="button__circle"><span class="icon icon--arrow-right"></span></span>
    </button>
  </section>

  <!-- Финал 4013:443 -->
  <section class="screen screen--final" aria-label="Финал">
    <img class="layer final__bg cover" src="assets/melody/final.webp" alt="Зверята водят хоровод вокруг граммофона">
    <div class="stack stack--accent">
      <a class="button button--md button--plain" href="choice.html?game=melody"><span class="t-label-md">Вернуться в меню</span></a>
      <div class="stack__text">
        <p class="t-text-lg">Отличная работа! Кажется, теперь вы&nbsp;узнаете произведения Чайковского с&nbsp;первых нот</p>
        <h2 class="t-display-md">Все мелодии угаданы!</h2>
      </div>
    </div>
  </section>

  <header class="header">
    <h1 class="header__title t-heading-md">Угадай мелодию</h1>
    <div class="header__actions">
      <a class="back-button" href="choice.html?game=melody">
        <span class="icon-button"><span class="icon icon--reply"></span></span>
        <span class="t-label-md">Назад</span>
      </a>
      <div class="header__group">
        <a class="icon-button" href="choice.html?game=melody" aria-label="В меню"><span class="icon icon--menu"></span></a>
        <button class="icon-button" type="button" data-sound aria-pressed="false" aria-label="Звук"><span class="icon icon--volume"></span></button>
      </div>
    </div>
  </header>
  <div class="counter t-label-lg" id="counter">1 / 6</div>
</main>
<script src="kiosk.js"></script>
<script>
  // Начать → Play → ответ: неверный (ошибка, Повторить) или верный (успех, Следующая мелодия).
  // Шесть мелодий, счётчик 1/6…6/6, после шестой финал. Звука в прототипе нет, Play только пульсирует.
  (function () {
    var TOTAL = 6, round = 1;
    var stage = document.getElementById('melody');
    var answers = document.getElementById('answers');
    var cards = Array.prototype.slice.call(answers.querySelectorAll('.answer-card'));
    var counter = document.getElementById('counter');
    var play = stage.querySelector('.play');

    function reset() {
      answers.classList.remove('is-locked');
      cards.forEach(function (c) { c.classList.remove('is-correct', 'is-wrong'); });
      play.classList.remove('is-playing');
      counter.textContent = round + ' / ' + TOTAL;
    }
    function show(name) { stage.dataset.screen = name; }
    function answer(c) {
      answers.classList.add('is-locked');
      if (c.hasAttribute('data-correct')) { c.classList.add('is-correct'); show('success'); }
      else { c.classList.add('is-wrong'); show('error'); }
      play.classList.remove('is-playing');
    }
    stage.querySelector('[data-go="listen"]').addEventListener('click', function () { round = 1; reset(); show('listen'); });
    play.addEventListener('click', function () { play.classList.toggle('is-playing'); });
    cards.forEach(function (c) { c.addEventListener('click', function () { answer(c); }); });
    stage.querySelector('[data-act="repeat"]').addEventListener('click', function () { reset(); show('listen'); play.classList.add('is-playing'); });
    stage.querySelector('[data-act="next"]').addEventListener('click', function () {
      if (round >= TOTAL) { show('final'); return; }
      round += 1; reset(); show('listen');
    });
    // Для сверки с макетом: melody.html#listen, #error, #success, #final
    var hash = location.hash.slice(1);
    if (hash === 'listen') { reset(); show('listen'); }
    else if (hash === 'error') { reset(); answer(cards[1]); }
    else if (hash === 'success') { reset(); answer(cards[2]); }
    else if (hash === 'final') show('final');
  })();
</script>
</body>
</html>
