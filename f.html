<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Figma</title>
<style>
  :root { --page: #000309; --text: #F5F8FF; --muted: #7A7D84; --accent: #B8D7FF; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--page); color: var(--text);
    font: 500 17px/26px Manrope, system-ui, sans-serif;
  }
  main { text-align: center; padding: 24px; }
  p { margin: 0 0 8px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: 14px; line-height: 20px; }
</style>
</head>
<body>
<main>
  <p id="status">Открываю в&nbsp;Figma</p>
  <p class="muted" id="hint"></p>
</main>
<script>
  // Переходник: https-ссылка, которая открывает кадр в приложении Figma.
  // Адрес: f.html?file=<ключ файла>&node-id=<id через дефис>
  // Принимает только ключ из букв и цифр и id из цифр, чтобы страницу
  // нельзя было использовать для перехода на посторонний адрес.
  var q = new URLSearchParams(location.search);
  var file = q.get('file') || '';
  var node = q.get('node-id') || '';
  var status = document.getElementById('status');
  var hint = document.getElementById('hint');
  if (/^[A-Za-z0-9]{10,40}$/.test(file) && /^$|^[0-9]+[-:][0-9]+$/.test(node)) {
    var target = 'figma://file/' + file + (node ? '?node-id=' + node.replace(':', '-') : '');
    var a = document.createElement('a');
    a.href = target;
    a.textContent = 'Открыть ещё раз';
    hint.append('Вкладку можно закрыть. ', a);
    location.href = target;
    // Закрываем вкладку сами, когда ссылка уже ушла в приложение. Firefox
    // разрешает это только при dom.allow_scripts_to_close_windows = true;
    // без настройки вызов молча не срабатывает и остаётся подсказка выше.
    setTimeout(function () { window.close(); }, 1500);
  } else {
    status.textContent = 'Ссылка неполная';
    hint.textContent = 'Нужен адрес вида f.html?file=ключ&node-id=1-2';
  }
</script>
</body>
</html>
